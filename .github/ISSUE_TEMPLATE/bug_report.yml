name: 缺陷报告
description: 报告可复现的阅读、下载或安装问题
title: '[Bug] '
labels: [bug]
body:
  - type: input
    id: environment
    attributes:
      label: 系统与应用版本
      placeholder: Windows 11 x64 / PaperLens 0.1.3
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤、预期行为和实际行为
      description: 可附公开论文链接或脱敏截图，不要上传私人 PDF 或凭据。
    validations:
      required: true
